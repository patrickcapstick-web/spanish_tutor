name: Generate audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - course.json
      - scripts/generate-audio.mjs
      - .github/workflows/audio.yml

permissions:
  contents: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate missing audio
        run: node scripts/generate-audio.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      - name: Commit audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
          git commit -m "Generate audio"
          git pull --rebase origin main
          git push origin HEAD:main
